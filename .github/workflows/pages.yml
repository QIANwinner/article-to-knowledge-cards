name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 部署在线 Demo
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # 前端零依赖、零构建：src/ 本身就是可发布的静态站点
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './src'

      - id: deployment
        uses: actions/deploy-pages@v4