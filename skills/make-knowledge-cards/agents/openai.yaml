interface:
  display_name: "Make Knowledge Cards"
  short_description: "把文章或本地 Markdown/TXT 转成知识卡片（上限 128 张，长文自动分批，不编造不凑数）"
  default_prompt: "Use $make-knowledge-cards to turn the supplied text or Markdown/TXT file into a Markdown deck. Read it all first. Keep one source-supported claim per card, merge duplicates, and omit plans and unanswered questions. Keep at most 128 cards across all batches, without padding. Preserve source disclaimers on cards with figures or named entities and in the single final footer."

policy:
  allow_implicit_invocation: true