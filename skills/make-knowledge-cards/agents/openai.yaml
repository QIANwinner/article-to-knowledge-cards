interface:
  display_name: "Make Knowledge Cards"
  short_description: "把文章或本地 Markdown/TXT 转成知识卡片（上限 128 张，长文自动分批，不编造不凑数）"
  default_prompt: "Use $make-knowledge-cards to turn this article into knowledge cards. Read the whole source first, select only disputable claims (plans and open questions are not cards), merge duplicates with the merge test, and keep at most 128 cards total. Each card needs a title, core knowledge, a plain explanation, and exactly one of a source-derived example or a self-test question; add a caveat field only when the source disagrees with itself. Never add facts, definitions, or figures the source does not contain, never pad the deck to hit a number, and never split one idea to reach a count. When the deck exceeds roughly 60 cards, split it into themed batches at the source's own section boundaries with continuous card numbering across batches, and carry any disclaimer in the source into the footer. If the source is thin, say so instead of inventing cards."

policy:
  allow_implicit_invocation: true